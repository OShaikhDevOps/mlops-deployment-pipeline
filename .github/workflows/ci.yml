name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -q

      - name: Run quick training (MLflow local - quick mode)
        run: |
          python -c "from src import train; train.train_and_log(quick=True)"

      - name: Build Docker image
        run: |
          docker build -t mlops-demo:latest .

      # Optional: push to registry (configure secrets)
      # - name: Push image
      #   uses: docker/build-push-action@v4
      #   with:
      #     push: true
      #     tags: ${{ secrets.REGISTRY }}/mlops-demo:${{ github.sha }}
